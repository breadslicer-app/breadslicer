[workspace]
resolver = "3"
members = [
    "apps/slicer-cli",
    "apps/slicer-gui",
    "libs/mesh-core",
    "libs/mesh-fixtures",
    "libs/mesh-formats",
    "libs/mesh-spatial",
    "libs/print-glue",
    "libs/print-primitives",
    "libs/print-profiles",
    "libs/sl1cer",
    "libs/sla-formats",
]

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.release]
codegen-units = 1
lto = "thin"
debug = false
strip = true

[workspace.dependencies]
sc-mesh-core = { path = "libs/mesh-core", version = "0.0.12" }
sc-mesh-fixtures = { path = "libs/mesh-fixtures", version = "0.0.12" }
sc-mesh-formats = { path = "libs/mesh-formats", version = "0.0.12" }
sc-mesh-spatial = { path = "libs/mesh-spatial", version = "0.0.12" }
sc-print-glue = { path = "libs/print-glue", version = "0.0.12" }
sc-print-primitives = { path = "libs/print-primitives", version = "0.0.12" }
sc-print-profiles = { path = "libs/print-profiles", version = "0.0.12" }
sc-sl1cer = { path = "libs/sl1cer", version = "0.0.12" }
sc-sla-formats = { path = "libs/sla-formats", version = "0.0.12" }

anyhow = "1.0.102"
float-cmp = "0.10.0"
nonempty-collections = "1.3.0"
proptest = "1.7.0"
semver = { version = "1.0.28", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
toml_edit = { version = "0.25.12", features = ["serde"] }
