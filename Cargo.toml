[workspace]
resolver = "3"
members = [
    "apps/icon-gen",
    "apps/profiles-converter",
    "apps/slicer-cli",
    "apps/slicer-gui",
    "apps/slicer-gui/crates/base",
    "apps/slicer-gui/crates/render",
    "apps/slicer-gui/crates/ui",
    "libs/3mf",
    "libs/app-paths",
    "libs/arrange",
    "libs/mesh-core",
    "libs/mesh-fixtures",
    "libs/mesh-formats",
    "libs/mesh-spatial",
    "libs/message-catalog",
    "libs/orient",
    "libs/print-glue",
    "libs/print-primitives",
    "libs/print-profiles",
    "libs/project-formats",
    "libs/review",
    "libs/scene",
    "libs/scene-edit",
    "libs/scene-fixtures",
    "libs/sl1cer",
    "libs/sla-formats",
    "libs/sla-formats-uvtools",
]

# `sc-geom` (see: `libs/sc-geom/Cargo.toml`) roots its own nested workspace.
# As a workspace for its sibling crates, so it stays out of the main repo's workspace.
# If not excluded below, cargo path dependencies ->leads to "multiple workspace roots".
exclude = ["libs/sc-geom"]

[workspace.package]
edition      = "2024"
repository = "https://github.com/breadslicer-app/breadslicer"
rust-version = "1.98.1"

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

# Dependencies carry no debug info in dev and test builds. Our own crates keep
# line tables, so a panic or a backtrace still names our file and line; every
# test executable and its debug symbols get smaller and link faster.
[profile.dev.package."*"]
debug = false

[profile.release]
codegen-units = 1
lto = "thin"
debug = false
strip = true

# Builds tried by hand for behaviour (gestures, placement, UI): release
# optimisation without LTO, with incremental compilation, so an edit rebuilds
# in seconds instead of minutes. Timings, benchmarks and published builds use
# `release`.
[profile.quick-release]
inherits = "release"
codegen-units = 256
lto = false
incremental = true

[workspace.dependencies]
sc-3mf = { path = "libs/3mf", version = "0.2.0" }
sc-app-paths = { path = "libs/app-paths", version = "0.2.0" }
sc-arrange = { path = "libs/arrange", version = "0.1.0" }
sc-mesh-core = { path = "libs/mesh-core", version = "0.2.0" }
sc-mesh-fixtures = { path = "libs/mesh-fixtures", version = "0.2.0" }
sc-mesh-formats = { path = "libs/mesh-formats", version = "0.2.0" }
sc-mesh-spatial = { path = "libs/mesh-spatial", version = "0.2.0" }
sc-message-catalog = { path = "libs/message-catalog", version = "0.1.0" }
sc-orient = { path = "libs/orient", version = "0.1.0" }
sc-print-glue = { path = "libs/print-glue", version = "0.2.0" }
sc-print-primitives = { path = "libs/print-primitives", version = "0.2.0" }
sc-print-profiles = { path = "libs/print-profiles", version = "0.3.0" }
# The .bread file format, kept in its own repository.
bread-format = { git = "https://github.com/breadslicer-app/bread-format", tag = "v0.3.0" }
sc-project-formats = { path = "libs/project-formats", version = "0.2.0" }
sc-review = { path = "libs/review", version = "0.1.0" }
sc-scene = { path = "libs/scene", version = "0.2.0" }
sc-scene-edit = { path = "libs/scene-edit", version = "0.2.0" }
sc-scene-fixtures = { path = "libs/scene-fixtures", version = "0.2.0" }
sc-sl1cer = { path = "libs/sl1cer", version = "0.2.0" }
sc-sla-formats = { path = "libs/sla-formats", version = "0.2.0" }
sc-sla-formats-uvtools = { path = "libs/sla-formats-uvtools", version = "0.1.0" }

sc-geom = { path = "libs/sc-geom", version = "0.0.2" }

# The GUI's own crates, split from `apps/slicer-gui` so that an edit rebuilds
# less of it (#361).
sc-slicer-gui-base = { path = "apps/slicer-gui/crates/base", version = "0.3.1" }
sc-slicer-gui-render = { path = "apps/slicer-gui/crates/render", version = "0.3.1" }
sc-slicer-gui-ui = { path = "apps/slicer-gui/crates/ui", version = "0.3.1" }

# Slint's default feature set minus FemtoVG renderer. One spec for every GUI
# crate, so the generated interface and the code that drives it agree.
slint = { version = "1.18.1", default-features = false, features = [
    "accessibility",
    "backend-winit",
    "compat-1-2",
    "image-default-formats",
    "renderer-skia",
    "renderer-software",
    "std",
    "unstable-wgpu-30",
    "unstable-winit-030",
] }
slint-build = "1.18.1"
# Note: keep wgpu version in sync with that used by Slint.
wgpu = { version = "30", default-features = false, features = ["std", "wgsl"] }


aes = "0.9.3"
any_ascii = "0.3.3"
anyhow = "1.0.102"
cbc = { version = "0.2.1", default-features = false }
chrono = { version = "0.4.44", default-features = false, features = ["clock"] }
crc32fast = "1.5.0"
flate2 = { version = "1.1.9", default-features = false, features = ["zlib-rs"] }
float-cmp = "0.10.0"
itoa = "1.0.18"
memchr = "2.8.3"
nonempty-collections = "1.3.0"
proptest = "1.7.0"
quick-xml = "0.41.0"
mimalloc = { version = "0.1", default-features = false }
rayon = "1.12.0"
ryu = "1.0.23"
semver = { version = "1.0.28", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10"
toml_edit = { version = "0.25.12", features = ["serde"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
# "deny" instead of "forbid": slicer-cli's Windows file-identity read carries
# a scoped allow.
unsafe_code = "deny"

# Block non-ASCII and visually confusable identifiers (homoglyph and
# trojan-source identifier attacks). The bidi text-flow control lints
# (text_direction_codepoint_in_literal / _in_comment) are already
# deny-by-default in rustc.
non_ascii_idents         = "deny"
confusable_idents        = "deny"
mixed_script_confusables = "deny"
uncommon_codepoints      = "deny"

missing_debug_implementations = "deny"
unreachable_pub               = "deny"
unused_qualifications         = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
