[workspace]
resolver = "3"
members = [
    "apps/slicer-cli",
    "apps/slicer-gui",
    "libs/mesh-core",
    "libs/mesh-formats",
    "libs/remote-printers",
    "libs/sla-formats",
    "libs/sl1cer",
    "libs/supports"
]

[profile.release]
codegen-units = 1
lto = "thin"
debug = false
strip = true

[workspace.dependencies]
sc-mesh-core = { path = "libs/mesh-core", version = "0.0.7" }
sc-mesh-formats = { path = "libs/mesh-formats", version = "*" }

anyhow = "1.0.102"
float-cmp = "0.10.0"
