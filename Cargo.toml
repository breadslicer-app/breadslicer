[workspace]
resolver = "3"
members = [
    "apps/slicer-cli",
    "apps/slicer-gui",
    "libs/mesh-core",
    "libs/mesh-formats",
    "libs/mesh-spatial",
]

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.release]
codegen-units = 1
lto = "thin"
debug = false
strip = true

[workspace.dependencies]
sc-mesh-core = { path = "libs/mesh-core", version = "0.0.12" }
sc-mesh-formats = { path = "libs/mesh-formats", version = "0.0.12" }
sc-mesh-spatial = { path = "libs/mesh-spatial", version = "0.0.12" }

anyhow = "1.0.102"
float-cmp = "0.10.0"
proptest = "1.7.0"
