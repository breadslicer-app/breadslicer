[package]
name = "sc-print-profiles"
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
authors = ["Andres Correa Casablanca <andreu@ctrlback.coop>"]
description = "Printer and material profile types, loading, and resolution for the resin-printing pipeline."
categories = ["data-structures"]
keywords = ["3d", "printing", "resin", "sla", "profiles"]
repository = "https://codeberg.org/SoulCrafted/Slicer"

[dependencies]
sc-app-paths = { workspace = true }
sc-print-primitives = { workspace = true, features = ["serde"] }
semver = { workspace = true }
serde = { workspace = true }
toml_edit = { workspace = true }
zip.workspace = true

[dev-dependencies]
nonempty-collections = { workspace = true }
tempfile = "3.23.0"