[package]
name = "sc-arrange"
version = "0.1.0"
edition.workspace = true
license = "Apache-2.0"
authors = ["SynrgStudio"]
description = "Arranges the objects of a resin plate by their real footprints: in height bands, so a part may reach over a shorter neighbour, or by their whole shadow."
categories = ["algorithms"]
keywords = ["3d", "slicer", "resin", "nesting", "packing"]
repository.workspace = true

[lints]
workspace = true

[dependencies]
sc-mesh-core.workspace = true

rayon.workspace = true

[dev-dependencies]
sc-mesh-fixtures.workspace = true
sc-mesh-formats.workspace = true
png = "0.18.1"
