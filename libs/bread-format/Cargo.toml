[package]
name = "sc-bread-format"
version = "0.1.0"
edition.workspace = true
license = "Apache-2.0"
authors = ["SynrgStudio"]
description = "The .bread project container: versioned, compressed and checksummed chunks, and the codecs of the scene and its meshes."
categories = ["encoding"]
keywords = ["3d", "slicer", "resin", "project", "format"]
repository.workspace = true

[lints]
workspace = true

[dependencies]
crc32fast.workspace = true
meshopt = "0.7"
sc-mesh-core.workspace = true
sc-scene.workspace = true
zstd = { version = "0.13", default-features = false }

[dev-dependencies]
sc-mesh-formats.workspace = true
