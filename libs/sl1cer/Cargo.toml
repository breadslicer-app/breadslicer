[package]
name = "sc-sl1cer"
version = "0.2.0"
edition.workspace = true
license = "Apache-2.0"
authors = ["Andres Correa Casablanca <andreu@ctrlback.coop>"]
description = "Slicing engine for resin 3d printers, built on sc-mesh-core"
categories = ["algorithms"]
keywords = ["3d", "slicer", "resin", "sla"]
repository.workspace = true
autotests = false

[lints]
workspace = true

[dependencies]
rayon.workspace = true

sc-mesh-core.workspace = true
sc-print-primitives.workspace = true
sc-scene.workspace = true

[dev-dependencies]
sc-mesh-fixtures.workspace = true

proptest.workspace = true

# Every file in `tests/` is a module of this one test binary, so the crate is
# linked once for its integration tests instead of once per file.
[[test]]
name = "main"
path = "tests/main.rs"
