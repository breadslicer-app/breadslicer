[package]
name = "generic-geom-alg-family-dispatch"
version = "0.0.1"
edition = "2024"
license = "AGPL-3.0-only"
authors = ["Sohail Siadat <sohail@entomind.co.uk>"]
description = "Dispatches a geometry-operation job (CSG subtract/intersect, mesh fixing, ...) to one of several algorithm variants behind one shared interface. No concrete operations registered yet."
categories = ["algorithms"]
keywords = ["geometry", "support", "csg", "handler", "transport"]
repository = "https://codeberg.org/SoulCrafted/Slicer"

[lints]
workspace = true

[dependencies]
sc-geom-transport-inprocess = { path = "../sc-geom-transport-inprocess", version = "0.0.1" }
sc-mesh-core = { path = "../../mesh-core", version = "0.1.0" }
sc-mesh-spatial = { path = "../../mesh-spatial", version = "0.1.0" }
sc-scene = { path = "../../scene", version = "0.1.0" }

[dev-dependencies]
