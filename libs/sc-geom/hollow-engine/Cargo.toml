[package]
name = "bread-hollow-engine"
version = "0.0.1"
edition = "2024"
license = "MIT"
authors = [
    "SynrgStudio",
]
description = "Hollowing for Breadslicer: exact wall distance, one cavity for the preview and the result, infill, and exact drain cuts."
categories = ["algorithms"]
keywords = ["geometry", "hollow", "3d-printing", "SLA"]
repository = "https://codeberg.org/SoulCrafted/Slicer"
autotests = false

[lints]
workspace = true

[dependencies]
bread-engine-base = { path = "../engine-base", version = "0.1.0" }
ahash = "0.8.12"
# Joins the parts of a model that overlap before it is hollowed (#453).
manifold-rust = "0.19.2"
rayon = "1.12"

[dev-dependencies]
serde_json = "1.0.150"

# Every file in `tests/` is a module of this one test binary, so the crate is
# linked once for its integration tests instead of once per file.
[[test]]
name = "main"
path = "tests/main.rs"
