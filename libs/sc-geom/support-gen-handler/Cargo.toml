[package]
name = "support-gen-handler"
version = "0.0.1"
edition = "2024"
license = "AGPL-3.0-only"
authors = ["Sohail Siadat <sohail@entomind.co.uk>"]
description = "Dispatches a support-generation job to one of several algorithm variants (support-gen-trivial, support-gen-chalyplex, ...) behind one shared interface."
categories = ["algorithms"]
keywords = ["geometry", "support", "printing"]
repository = "https://codeberg.org/SoulCrafted/Slicer"

[lints]
workspace = true

[dependencies]
sc-geom-transport-inprocess = { path = "../sc-geom-transport-inprocess" }
sc-mesh-core = { path = "../../mesh-core" }
sc-mesh-spatial = { path = "../../mesh-spatial" }
sc-scene = { path = "../../scene" }

[dev-dependencies]
