[package]
name = "sc-geom"
version = "0.0.2"
edition = "2024"
license = "AGPL-3.0-only"
authors = ["Sohail Siadat <sohail@entomind.co.uk>"]
description = "Advanced geometry operations (support generation, shell, offset) for the SoulCrafted Slicer."
categories = ["algorithms"]
keywords = ["3d", "geometry", "support", "3d-printing", "SLA"]
repository = "https://codeberg.org/SoulCrafted/Slicer"

[lints]
workspace = true

[dependencies]
# Facade crate: the one thing the main app (SoulCrafted Slicer) depends on. Its own dependency line never doe snot need to change as this workspace's internal module boundaries change.
# It only re-exports below modules. No code of its own.
generic-geom-alg-family-dispatch = { path = "generic-geom-alg-family-dispatch", version = "0.0.1" }
sc-geom-transport-inprocess = { path = "sc-geom-transport-inprocess", version = "0.0.1" }
support-gen-trivial = { path = "support-gen-trivial", version = "0.0.2" }
support-gen-family-dispatch = { path = "support-gen-family-dispatch", version = "0.0.1" }

[dev-dependencies]

# We chose a nested workspace root: this facade is a real package (for above).
# It roots its own workspace for its sibling crates below.
# So that, Cargo stops its ancestor search here, instead of walking up into the main app's own `[workspace]`.
# It keeps this subsystem's internal boundaries self-contained rather than declared by the outer repo.
[workspace]
members = [
    "generic-geom-alg-family-dispatch",
    "sc-geom-transport-inprocess",
    "support-gen-chalyplex",
    "support-gen-family-dispatch",
    "support-gen-trivial",
]

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
