[package]
name = "support-gen-df"
version = "0.0.1"
edition = "2024"
license = "AGPL-3.0-or-later"
authors = [
    "DragonFruit, Open Resin Alliance and contributors",
    "SynrgStudio",
]
description = "Native Rust port of DragonFruit's support system (types, registry, primitives, placement, auto-support, bracing, rafts) for the SoulCrafted Slicer."
categories = ["algorithms"]
keywords = ["geometry", "support", "3d-printing", "SLA", "dragonfruit"]
repository = "https://codeberg.org/SoulCrafted/Slicer"
autotests = false

[lints]
workspace = true

[dependencies]
libm = "0.2.16"
rayon = "1.12"
ahash = "0.8.12"
smallvec = "1.16"
indexmap = { version = "2.14.2", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150", features = ["preserve_order", "float_roundtrip"] }

# Every file in `tests/` is a module of this one test binary, so the crate is
# linked once for its integration tests instead of once per file.
[[test]]
name = "main"
path = "tests/main.rs"
