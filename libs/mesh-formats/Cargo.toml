[package]
name = "sc-mesh-formats"
version = "0.0.2"
edition = "2024"
license = "Apache-2.0"
authors = ["Andres Correa Casablanca <andreu@ctrlback.coop>"]
description = "A library to load, inspect & write 3d mesh data."
categories = ["rendering::data-formats"]
keywords = ["3d", "mesh", "stl"]
repository = "https://codeberg.org/SoulCrafted/Slicer"

[dependencies]
anyhow.workspace = true
regex = { version = "1.12.3", default-features = false }

serde = { version = "1.0.228", features = ["derive"] }
