[package]
name = "bread-printer-link"
version = "0.1.0"
edition.workspace = true
license = "Apache-2.0"
authors = ["SynrgStudio"]
description = "Sends a printer file to a resin printer on the local network and starts the print: SDCP v3 (Elegoo)."
categories = ["network-programming"]
keywords = ["3d", "slicer", "resin", "printer", "sdcp"]
repository.workspace = true

[lints]
workspace = true

[dependencies]
serde_json.workspace = true
if-addrs = "0.13"
tungstenite = { version = "0.27", default-features = false, features = ["handshake"] }
retina = { version = "0.4.22", default-features = false }
tokio = { version = "1.53", features = ["rt", "net", "time"] }
futures-util = { version = "0.3", default-features = false }
openh264 = "0.9.10"
url = "2.5"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
