[package]
name = "sc-3mf"
version = "0.2.0"
edition.workspace = true
license = "Apache-2.0"
authors = ["Andres Correa Casablanca <andreu@ctrlback.coop>"]
description = "3MF vocabulary crate: the OPC package container plus a typed 3D Model document."
categories = ["rendering::data-formats"]
keywords = ["3d", "3mf", "opc", "slice"]
repository.workspace = true
autotests = false

[lints]
workspace = true

[dependencies]
crc32fast.workspace = true
flate2.workspace = true
itoa.workspace = true
memchr.workspace = true
quick-xml.workspace = true
rayon.workspace = true
ryu.workspace = true
zip.workspace = true

[dev-dependencies]
proptest.workspace = true

# Every file in `tests/` is a module of this one test binary, so the crate is
# linked once for its integration tests instead of once per file.
[[test]]
name = "main"
path = "tests/main.rs"
