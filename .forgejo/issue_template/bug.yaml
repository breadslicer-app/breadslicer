name: "🐛 Bug Report"
about: "Report a possible bug or regression"
title: "🐛 Bug: "
ref: "main"
labels:
  - "Report/Bug"
  - "Tracking/Triage"
body:
  - type: "markdown"
    attributes:
      value: "Thank you for submitting the bug! We'll try to triage it ASAP!"

  - type: "markdown"
    attributes:
      value: |
        Bug reports that don't follow this template will be closed.
        Please provide a clear and concise description of what the bug is.

  - type: "dropdown"
    id: "operating_system"
    attributes:
      label: "Operating System"
      multiple: false
      options:
        - "BSD"
        - "Linux"
        - "Macos"
        - "Windows"
        - "Not relevant"
    validations:
      required: true

  - type: "input"
    id: "os_version"
    attributes:
      label: "Operating System Version"
      description: |
        For Windows and Macos, we just need its number (7, 8, 10...). For Linux,
        knowing which distro is also important (Ubuntu, Fedora, Arch...)
    validations:
      required: false

  - type: "dropdown"
    id: "cpu_arch"
    attributes:
      label: "CPU Architecture"
      description: |
        What kind of computer are you running your slicer on?
      multiple: false
      options:
        - "amd64 (x86_64) - 'classic PC', Intel & AMD processors"
        - "arm64 - Apple M1/M2/..., Chromebooks, ..."
        - "riscv - Some experimental/fringe platforms"
        - "Not relevant"
    validations:
      required: true

  - type: "input"
    id: "slicer_version"
    attributes:
      label: "Slicer Version"
      description: |
        The version of the Slicer application where you found the issue.
    validations:
      required: false

  - type: "input"
    id: "printer_model"
    attributes:
      label: "3D Printer Model"
      description: |
        In case the problem is related to your specific printer, leave us here
        its model name & number.
    validations:
      required: false

  - type: "textarea"
    id: "steps_to_reproduce"
    attributes:
      label: "What happened?"
      description: |
        Provide a detailed list of steps that reproduce the issue
        The more information and included steps, the quicker your report can be triaged and addressed!
      placeholder: |
        1.
        2.
    validations:
      required: true

  - type: "textarea"
    id: "expected_result"
    attributes:
      label: "Expected result"
      description: "Describe what you expected to happen."
      placeholder: "It should not throw an error."
    validations:
      required: true

  - type: "checkboxes"
    id: "terms"
    attributes:
      label: "Code of Conduct"
      description: |
        By submitting this issue, you agree to follow our
        [Code of Conduct](https://codeberg.org/SoulCrafted/Slicer/src/branch/main/CODE_OF_CONDUCT.md)
      options:
        - label: "I agree to follow SoulCrafted's Code of Conduct"
          required: true
