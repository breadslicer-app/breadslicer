name: Test

on: [push]

jobs:
  check:
    name: "Check, Clippy & Build"
    runs-on: "codeberg-medium"
    steps:
      - name: "Checkout Repository"
        uses: "actions/checkout@v4"

      - name: "Get rustup from cache"
        uses: "actions/cache@v5"
        id: "rustup-cache"
        with:
          path: |
            ~/.rustup
            ~/.cargo/bin
          key: "rustup-stable"

      - name: "Get Rust crates from cache"
        uses: "actions/cache@v5"
        id: "crates-cache"
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: crates-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}-${{ forgejo.ref }}
          restore-keys: |
            crates-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}-
            crates-${{ runner.os }}-

      - name: "Get pre-compiled code from cache"
        uses: "actions/cache@v5"
        id: "compilations-cache"
        with:
          path: |
            target/
          key: crates-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}-${{ forgejo.ref }}-${{ hashFiles('libs/**/*') }}-${{ hashFiles('apps/**/*') }}-${{ forgejo.run_number }}
          restore-keys: |
            crates-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}-${{ forgejo.ref }}-${{ hashFiles('libs/**/*') }}-${{ hashFiles('apps/**/*') }}-
            crates-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}-${{ forgejo.ref }}-${{ hashFiles('libs/**/*') }}-
            crates-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}-${{ forgejo.ref }}-
            crates-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}-
            crates-${{ runner.os }}-

      - name: "Install Rust"
        if: "steps.rustup-cache.outputs.cache-hit != 'true'"
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable

      - name: "Add cargo to PATH"
        run: "echo \"$HOME/.cargo/bin\" >> $GITHUB_PATH"

      - name: "Basic Checks"
        run: "cargo check --profile ci"

      - name: "Clippy Checks"
        run: "cargo clippy --profile ci -- -D warnings"

      # - name: "Compile"
      #   run: "cargo build --profile ci"

      # - name: "Test"
      #   run: "cargo test --profile ci"
