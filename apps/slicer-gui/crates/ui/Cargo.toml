[package]
name = "sc-slicer-gui-ui"
version = "0.3.1"
edition.workspace = true
license = "AGPL-3.0-or-later"
description = "The Rust code Slint generates from the Breadslicer interface (`apps/slicer-gui/ui`), in a crate of its own so editing the GUI's Rust code does not run the Slint compiler again."

[lints]
workspace = true

[dependencies]
slint = { workspace = true }

[build-dependencies]
slint-build = { workspace = true }
