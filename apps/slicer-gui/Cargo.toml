[package]
name = "sc-slicer-gui"
version = "0.3.1"
edition.workspace = true
license = "AGPL-3.0-or-later"
autotests = false

[lints]
workspace = true

[lib]
name = "sc_slicer_gui"
path = "src/lib.rs"

[[bin]]
name = "breadslicer"
path = "src/main.rs"

[dependencies]
mimalloc.workspace = true
sc-app-paths = { workspace = true }
sc-arrange = { workspace = true }
sc-orient = { workspace = true }
sc-geom = { workspace = true }
sc-mesh-core = { workspace = true }
sc-mesh-formats = { workspace = true }
sc-mesh-spatial = { workspace = true }
sc-print-glue = { workspace = true }
sc-print-primitives = { workspace = true, features = ["serde"] }
sc-print-profiles = { workspace = true }
sc-project-formats = { workspace = true }
sc-review = { workspace = true }
sc-scene = { workspace = true }
sc-scene-edit = { workspace = true }
sc-sl1cer = { workspace = true }
sc-sla-formats = { workspace = true }
sc-sla-formats-uvtools = { workspace = true }
sc-slicer-gui-base = { workspace = true }
sc-slicer-gui-render = { workspace = true }
sc-slicer-gui-ui = { workspace = true }

anyhow = { workspace = true }
bytemuck = { version = "1.18", features = ["derive"] }
chrono = { workspace = true }
futures-channel = "0.3"
glam = "0.32.1"
ico = "0.5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
harfrust = "0.8"
newtypes = "0.6.0"
rfd = "0.17.2"
zip = { workspace = true }
swash = { version = "0.2.10", default-features = false, features = [
    "render",
    "scale",
] }
slint = { workspace = true }
wgpu = { workspace = true }
pollster = "0.4"
serde = { version = "1.0.228", features = ["derive"] }
sys-locale = "0.3.2"
toml = "1.1.2"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", features = ["objc2-core-services"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
sc-message-catalog = { workspace = true }
toml = "1.1.2"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.31"

[dev-dependencies]
bread-format = { workspace = true }
sc-message-catalog = { workspace = true }
sc-slicer-gui-base = { workspace = true, features = ["test-support"] }
sc-slicer-gui-render = { workspace = true, features = ["test-support"] }
sc-mesh-fixtures = { workspace = true }
sc-print-primitives = { workspace = true }
sc-scene-fixtures = { workspace = true }

float-cmp = { workspace = true }
# The support test plate (#464) edits a support document as JSON.
serde_json = { workspace = true }
# Slint's element queries (positions and sizes of laid-out elements) for
# layout tests; the same version as `slint`.
i-slint-backend-testing = "=1.18.1"
tempfile = "3.23.0"

# Every file in `tests/` is a module of this one test binary, so the crate is
# linked once for its integration tests instead of once per file.
[[test]]
name = "main"
path = "tests/main.rs"
