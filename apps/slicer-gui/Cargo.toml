[package]
name = "sc-slicer-gui"
version = "0.0.8"
edition = "2024"

[[bin]]
name = "sc-slicer-gui"

[dependencies]
sc-mesh-core = { workspace = true }
sc-mesh-formats = { workspace = true }

anyhow = { workspace = true }
bytemuck = { version = "1.18", features = ["derive"] }
glam = "0.32.1"
rfd = "0.17.2"
slint = { version = "1.15.1", features = ["renderer-skia", "unstable-wgpu-28"] }


[build-dependencies]
slint-build = "1.14.1"

[dev-dependencies]
float-cmp = { workspace = true }
