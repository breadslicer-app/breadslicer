[package]
name = "sc-slicer-gui"
version = "0.1.0"
edition = "2024"

[lib]
name = "sc_slicer_gui"
path = "src/lib.rs"

[[bin]]
name = "sc-slicer-gui"
path = "src/main.rs"

[dependencies]
sc-app-paths = { workspace = true }
sc-mesh-core = { workspace = true }
sc-mesh-formats = { workspace = true }
sc-mesh-spatial = { workspace = true }
sc-print-primitives = { workspace = true }
sc-print-profiles = { workspace = true }

anyhow = { workspace = true }
bytemuck = { version = "1.18", features = ["derive"] }
chrono = { version = "0.4.44", default-features = false, features = ["clock"] }
glam = "0.32.1"
ico = "0.5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rfd = "0.17.2"
rustybuzz = "0.20"
slint = { version = "1.17.0", features = [
    "image-default-formats",
    "renderer-skia",
    "unstable-wgpu-29",
    "unstable-winit-030",
] }
# Direct dependency only to enable wgpu's `wgsl` feature on the same
# crate Slint re-exports as `slint::wgpu_29::wgpu`. Slint pulls wgpu
# with default features off, which drops the `ShaderSource::Wgsl`
# variant; Keep the major version locked to Slint's `unstable-wgpu-29`.
wgpu = { version = "29", default-features = false, features = ["wgsl"] }
pollster = "0.4"
serde = { version = "1.0.228", features = ["derive"] }
sys-locale = "0.3.2"
toml = "1.1.2"


[build-dependencies]
slint-build = "1.17.0"
toml = "1.1.2"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.31"

[dev-dependencies]
sc-print-primitives = { workspace = true }

float-cmp = { workspace = true }
tempfile = "3.23.0"
