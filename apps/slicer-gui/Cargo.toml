[package]
name = "sc-slicer-gui"
version = "0.0.10"
edition = "2024"

[[bin]]
name = "sc-slicer-gui"

[dependencies]
sc-mesh-core = { workspace = true }
sc-mesh-formats = { workspace = true }

anyhow = { workspace = true }
bytemuck = { version = "1.18", features = ["derive"] }
glam = "0.32.1"
rfd = "0.17.2"
slint = { version = "1.16.1", features = [
    "renderer-skia",
    "unstable-wgpu-28",
    "unstable-winit-030",
] }
directories = "6.0.0"
pollster = "0.4"
serde = { version = "1.0.228", features = ["derive"] }
sys-locale = "0.3.2"
toml = "1.1.2"


[build-dependencies]
slint-build = "1.16.1"
toml = "1.1.2"

[dev-dependencies]
float-cmp = { workspace = true }
tempfile = "3.23.0"
