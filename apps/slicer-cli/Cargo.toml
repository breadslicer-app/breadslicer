[package]
name = "sc-slicer-cli"
version = "0.4.0-alpha.1"
edition.workspace = true
license = "AGPL-3.0-or-later"
autotests = false

[lints]
workspace = true

[[bin]]
name = "sc-slicer-cli"

[dependencies]
mimalloc.workspace = true
sc-app-paths.workspace = true
sc-geom.workspace = true
sc-mesh-core.workspace = true
sc-mesh-formats.workspace = true
bread-orient.workspace = true
sc-print-glue.workspace = true
sc-print-primitives.workspace = true
sc-print-profiles.workspace = true
sc-project-formats.workspace = true
bread-review = { workspace = true, features = ["serde"] }
sc-scene.workspace = true
sc-sl1cer.workspace = true
sc-sla-formats.workspace = true
bread-sla-formats-uvtools.workspace = true

anyhow.workspace = true
rayon.workspace = true
serde_json.workspace = true

bpaf = "0.9.24"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
sc-3mf.workspace = true
sc-mesh-fixtures.workspace = true
# The support scorecard reads the support engine's plan directly.
bread-support-bracing = { path = "../../libs/sc-geom/support-bracing" }
bread-support-geom = { path = "../../libs/sc-geom/support-geom" }
bread-support-mesh = { path = "../../libs/sc-geom/support-mesh" }
bread-support-model = { path = "../../libs/sc-geom/support-model" }
bread-support-pipeline = { path = "../../libs/sc-geom/support-pipeline" }
bread-support-placement = { path = "../../libs/sc-geom/support-placement" }

assert_cmd = "2.0.18"
png = "0.18.1"
predicates = "3.1.3"
tempfile = "3.23.0"

# Every file in `tests/` is a module of this one test binary, so the crate is
# linked once for its integration tests instead of once per file.
[[test]]
name = "main"
path = "tests/main.rs"
