# Resin figures that no source dataset publishes, keyed by the material
# id the converter derives from a record's brand and name.
#
# `source` is the vendor sheet a figure was read off, and `read_on` the
# day it was read, so a sheet the vendor has since revised can be told
# apart from a transcription error.
#
# One resin the bundle carries is deliberately absent. Craft (Glow in
# Dark) takes no figure because its strontium aluminate pigment is far
# denser than the base resin, which makes the line's value wrong rather
# than approximate.

[siraya-tech-blu-clear-v2-emerald-blue]
source = "https://siraya.tech/pages/blu-tough-resin-tds-for-regular-blu"
read_on = "2026-09-10"
physical = { liquid_density_g_per_cm3 = 1.1, cured_density_g_per_cm3 = 1.15 }

