[package]
name = "sc-profiles-converter"
version = "0.0.1"
edition.workspace = true
license = "AGPL-3.0-or-later"
publish = false
description = "Convert third-party printer and material profiles into the SoulCrafted Slicer TOML format."
autotests = false

[lints]
workspace = true

[dependencies]
sc-print-primitives.workspace = true
sc-print-profiles.workspace = true

anyhow.workspace = true
nonempty-collections.workspace = true
quick-xml.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
toml_edit.workspace = true
zip.workspace = true

bpaf = "0.9.24"
scraper = "0.29.0"

[dev-dependencies]
tempfile = "3.23.0"

# Every file in `tests/` is a module of this one test binary, so the crate is
# linked once for its integration tests instead of once per file.
[[test]]
name = "main"
path = "tests/main.rs"
